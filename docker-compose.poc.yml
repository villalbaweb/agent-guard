services:

  # --- Redis — shared state, blueprint cache, loop-detection history ---
  redis:
    image: redis:7-alpine
    container_name: agentguard_redis_poc
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- AgentGuard REST API (Step B) ---
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  default:
    name: agentguard_poc_network
