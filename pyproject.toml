[project]
name = "agentguard"
version = "0.2.0"
description = "A research testbed for governed, recursive multi-agent systems."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Villalba", email = "villalbaweb@gmail.com" }]
keywords = ["llm", "agents", "governance", "policy", "langgraph", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic",
    "langchain-google-vertexai",
    "langchain-google-genai",
    "langchain-openai",
    "python-dotenv",
    "langgraph",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.0",
    # Step B — REST API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    # Step C — JWT identity propagation
    "pyjwt>=2.9.0",
    # U-09/U-12 — PostgreSQL + pgvector for agent registry
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
]
requires-python = ">=3.13"


[project.scripts]
agentguard-eval = "scripts.run_eval:main"

[project.urls]
Repository = "https://github.com/villalbaweb/agent-guard"

[project.optional-dependencies]
hitl-redis = [
    "langgraph-checkpoint-redis>=0.0.1",
]
mcp = []

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "tests_tmp"]
addopts = "-s"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
