[project]
name = "agent-guard"
version = "0.1.0"
description = "A policy-driven agentic operating system."
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic",
    "langchain-google-vertexai",
    "langchain-google-genai",
    "langchain-openai",
    "python-dotenv",
    "langgraph",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pyyaml>=6.0.0",
]
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_tmp"]
addopts = "-s"
